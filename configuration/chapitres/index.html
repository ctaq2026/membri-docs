    <h1>Créer un chapitre</h1>

    <p>Pour créer un chapitre dans Membri 365 :</p>

    <ol>
      <li>Sélectionner <strong>+ Nouveau</strong> dans la barre d’outils pour ouvrir le formulaire <strong>Créer Chapitre</strong>.</li>
      <li>Compléter les divers champs obligatoires et facultatifs des encadrés de l’onglet <strong>Général</strong>.</li>
    </ol>
